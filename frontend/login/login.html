<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title"></title>
    <!-- 引入本地自托管的加密库（离线可用，避免第三方 CDN 风险） -->
    <script src="/common/lib/crypto-js.min.js"></script>
    <!-- 使用绝对路径引入资源 -->
    <script src="/common/theme_manager.js"></script>
    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="../common/themes/light/theme.css">
    <link rel="stylesheet" href="../common/themes/dark/theme.css">
    <link rel="stylesheet" href="../common/appearance_manager.css">
    <link rel="stylesheet" href="/login/login.css">
</head>
<body>
    <div class="login-appearance-actions appearance-actions">
        <button type="button" class="appearance-btn appearance-theme-btn" data-appearance-theme-toggle>
            <span class="theme-icon appearance-sun icon-sun" aria-hidden="true"></span>
            <span class="theme-icon appearance-moon icon-moon" aria-hidden="true"></span>
        </button>
        <button type="button" class="appearance-btn appearance-language-btn" data-appearance-language-open>
            <span class="theme-icon icon-language" aria-hidden="true"></span>
        </button>
    </div>
    <main class="main-content">
        <div class="card-container">
            <h2 class="title" data-i18n="login.title"></h2>
            
            <div class="form-group">
                <label class="label-text" for="username" data-i18n="login.username"></label>
                <input type="text" id="username" class="input-field" placeholder="" data-i18n-placeholder="login.username_placeholder" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="label-text" for="password" data-i18n="login.password"></label>
                <input type="password" id="password" class="input-field" placeholder="" data-i18n-placeholder="login.password_placeholder" autocomplete="current-password">
            </div>

            <button id="loginBtn" class="btn-primary" data-i18n="login.login_btn"></button>
            
            <div id="message" class="message"></div>
        </div>
    </main>

    <!-- 引入多语言资源 -->
    <script src="/common/i18n/zh.js"></script>
    <script src="/common/i18n/en.js"></script>
    <script src="../common/i18n/i18n_utils.js"></script>
    <script src="../common/appearance_manager.js"></script>

    <!-- 使用绝对路径引入基础依赖库 -->
    <script src="/common/request.js"></script>
    <script src="/common/toast.js"></script>
    <script src="/common/ui_components.js"></script>
    <!-- 页面逻辑 -->
    <script src="/login/login.js"></script>
    <script src="/login/login_request.js"></script>

    <!-- 应用版本号显示 -->
    <div id="app-version-display" class="app-version-footer"></div>
</body>
</html>
